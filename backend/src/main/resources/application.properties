spring.application.name=dolphin
# PORT is set by Render; SERVER_PORT is handy locally
server.port=${PORT:${SERVER_PORT:8080}}

# Local secrets (Cloudflare credentials, JWT_SECRET) as KEY=value lines in backend/d1.env - never committed.
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:./d1.env[.properties],optional:file:./backend/d1.env[.properties]

# JWT - the secret MUST be supplied through JWT_SECRET (environment variable or d1.env)
# (at least 32 characters). No production secret is committed to the repository.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated origins allowed to call the API (frontend dev server by default). Wildcards are allowed,
# e.g. https://dolphin.vercel.app,https://dolphin-*.vercel.app for Vercel preview deployments.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin account seeded at startup if it does not exist yet
dolphin.admin.email=${ADMIN_EMAIL:admin@dolphin.com}
dolphin.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Storage: all data lives in Cloudflare D1. The backend refuses to start without the D1 credentials below.
# ("memory" exists only for the automated tests and is never used unless DOLPHIN_STORAGE=memory is set.)
dolphin.storage=${DOLPHIN_STORAGE:d1}

# Cloudflare D1 - the API token needs the "D1 Edit" permission.
dolphin.d1.account-id=${CLOUDFLARE_ACCOUNT_ID:}
dolphin.d1.database-id=${CLOUDFLARE_D1_DATABASE_ID:}
dolphin.d1.api-token=${CLOUDFLARE_API_TOKEN:}
dolphin.d1.timeout=${CLOUDFLARE_D1_TIMEOUT:15s}
